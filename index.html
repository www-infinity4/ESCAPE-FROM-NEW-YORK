<body>
    <div id="game-wrapper">
        <div id="sticky-game-screen">
            <canvas id="gameCanvas" width="600" height="500"></canvas>
            <div id="screen-label">GAME SCREEN STAYS HERE WHILE YOU CHOOSE</div>
        </div>
        <section id="game-reader" role="status" aria-live="polite" aria-atomic="true">
            <div id="reader-heading">ESCAPE FROM NEW YORK</div>
            <div id="reader-body">Tap A to start. The mission text and questions will appear here in large type.</div>
        </section>
        <div id="phone-help">Read the mission, then tap A to continue. Use the green direction pad to move. Tap A to answer or confirm; START pauses.</div>
        <div id="mobile-controls">
            <div id="dpad">
                <div class="dpad-row">
                    <button class="dpad-btn" id="btn-up" aria-label="Up">▲</button>
                </div>
                <div class="dpad-row">
                    <button class="dpad-btn" id="btn-left" aria-label="Left">◄</button>
                    <div class="dpad-center"></div>
                    <button class="dpad-btn" id="btn-right" aria-label="Right">►</button>
                </div>
                <div class="dpad-row">
                    <button class="dpad-btn" id="btn-down" aria-label="Down">▼</button>
                </div>
            </div>
            <div id="action-area">
                <button class="action-btn" id="btn-start" aria-label="Start">START</button>
                <button class="action-btn btn-b" id="btn-b" aria-label="B button">B</button>
                <button class="action-btn btn-a" id="btn-a" aria-label="A button">A</button>
            </div>
        </div>
    </div>

    <script src="js/data.js?v=20260827-revenge4"></script>
    <script src="js/scenarios.js?v=20260827-revenge4"></script>
    <script src="js/renderer.js?v=20260827-revenge4"></script>
    <script src="js/game.js?v=20260827-revenge4"></script>
<script src="https://www-infinity4.github.io/Mint-For-Infinity/infinity-wallet-menu.js?v=20260814-menu2"></script></body>
